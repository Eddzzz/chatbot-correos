name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture_ci_ephemeral
          POSTGRES_DB: correos_sandbox_fixture
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d correos_sandbox_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend
        working-directory: backend
        run: |
          python -m pip install uv==0.11.8
          uv sync --frozen
      - name: Prepare isolated synthetic database
        env:
          PGPASSWORD: fixture_ci_ephemeral
        run: |
          psql -h 127.0.0.1 -p 55432 -U fixture_admin -d correos_sandbox_fixture -v ON_ERROR_STOP=1 -f database/fixtures/001_synthetic.sql -f database/views/001_projection.sql -f database/policies/002_reader_role.sql
          psql -h 127.0.0.1 -p 55432 -U fixture_admin -d correos_sandbox_fixture -v ON_ERROR_STOP=1 -c "CREATE ROLE chatbot_fixture LOGIN PASSWORD 'fixture_ci_ephemeral' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS; GRANT chatbot_reader TO chatbot_fixture; ALTER ROLE chatbot_fixture SET default_transaction_read_only=on;"
          mkdir -p .runtime
          echo 'postgresql://chatbot_fixture:fixture_ci_ephemeral@127.0.0.1:55432/correos_sandbox_fixture' > .runtime/fixture-dsn.txt
          echo 'fixture_ci_ephemeral' > .runtime/initdb-password
      - name: Test contracts, architecture and real PostgreSQL
        working-directory: backend
        run: uv run --frozen pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
