[project]
name = "correos-bolivia-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1", "sqlglot>=26,<31"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
