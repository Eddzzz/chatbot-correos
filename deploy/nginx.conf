# Replace hostname and certificate paths with institution-managed values.
server {
    listen 443 ssl;
    server_name correos-chat.interno;
    ssl_certificate /etc/correos-chat/tls/fullchain.pem;
    ssl_certificate_key /etc/correos-chat/tls/privkey.pem;
    root /opt/correos-bolivia-chatbot/frontend/dist;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 100s;
        add_header Cache-Control no-store always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
